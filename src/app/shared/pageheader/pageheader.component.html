<ion-header class="ion-no-border">
  <ion-toolbar>
    @if (backHref) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="backHref" text="" aria-label="Go back"></ion-back-button>
      </ion-buttons>
    }
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ng-content></ng-content>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
