<ion-header class="ion-no-border">
  <ion-toolbar>
    @if (backHref) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="backHref" text="" aria-label="Go back"></ion-back-button>
      </ion-buttons>
    }
    <div class="bar">
      <h1 class="ttl">{{ title }}</h1>
      <div class="mid"><ng-content select="[center]"></ng-content></div>
    </div>
    <ion-buttons slot="end">
      <ng-content></ng-content>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
