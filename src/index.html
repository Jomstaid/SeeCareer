<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>SeeCareer</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#07122b" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/svg+xml" href="assets/icon/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon32.png" />
  <link rel="apple-touch-icon" href="assets/icon/icon192.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <script>window.__splashAt = Date.now();</script>
  <!-- Start screen. Pure CSS and an inline logo, so it shows at once; the app removes it when it is ready. -->
  <div id="splash" role="status" aria-label="Loading SeeCareer">
    <style>
      #splash {
        --s-bg: #f3f7ff; --s-text: #0f1f3d; --s-muted: #52627f; --s-a: #2f6bff; --s-b: #0fb5a3;
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: var(--s-bg);
        font-family: 'VT323', monospace;
        transition: opacity 500ms ease, visibility 500ms ease;
      }
      @media (prefers-color-scheme: dark) {
        #splash { --s-bg: #000000; --s-text: #e8f0ff; --s-muted: #9fb2d3; }
      }
      :root.ion-palette-dark #splash { --s-bg: #000000; --s-text: #e8f0ff; --s-muted: #9fb2d3; }
      #splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash .stack { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #splash svg { width: 108px; height: 108px; display: block; filter: drop-shadow(0 16px 28px rgba(47, 107, 255, .28)); animation: s-pop 600ms cubic-bezier(.2, .9, .3, 1.15) both; }
      #splash .eye { stroke-dasharray: 1; stroke-dashoffset: 1; animation: s-draw 900ms 250ms cubic-bezier(.5, 0, .2, 1) forwards; }
      #splash .b { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: s-grow 520ms cubic-bezier(.2, .9, .3, 1.25) forwards; }
      #splash .b1 { animation-delay: 950ms; }
      #splash .b2 { animation-delay: 1070ms; }
      #splash .b3 { animation-delay: 1190ms; }
      #splash h1 { margin: 0; font: 700 30px/1 'VT323', monospace; letter-spacing: -.02em; color: var(--s-text); opacity: 0; animation: s-up 600ms 1150ms ease forwards; }
      #splash p { margin: -8px 0 0; font-size: 14px; color: var(--s-muted); opacity: 0; animation: s-up 600ms 1350ms ease forwards; }
      #splash .line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; }
      #splash .line i { display: block; height: 100%; width: 32%; background: linear-gradient(90deg, transparent, var(--s-a), var(--s-b), transparent); animation: s-slide 1.5s ease-in-out infinite; }
      @keyframes s-pop { from { opacity: 0; transform: scale(.86); } }
      @keyframes s-draw { to { stroke-dashoffset: 0; } }
      @keyframes s-grow { to { transform: scaleY(1); } }
      @keyframes s-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes s-slide { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        #splash .eye { stroke-dashoffset: 0; } #splash .b { transform: none; } #splash h1, #splash p { opacity: 1; }
      }
    </style>
    <div class="stack">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="sg" x1="8" y1="4" x2="92" y2="96" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0fb5a3"/></linearGradient>
        </defs>
        <rect width="100" height="100" rx="27" fill="url(#sg)"/>
        <path class="eye" pathLength="1" d="M12 52Q50 11 88 52Q50 93 12 52Z" fill="none" stroke="#fff" stroke-width="6.5" stroke-linejoin="round"/>
        <rect class="b b1" x="36" y="52" width="8" height="10" rx="4" fill="#fff"/>
        <rect class="b b2" x="46" y="47" width="8" height="15" rx="4" fill="#fff"/>
        <rect class="b b3" x="56" y="41" width="8" height="21" rx="4" fill="#fff"/>
      </svg>
      <h1>SeeCareer</h1>
      <p>Find work that fits you</p>
    </div>
    <div class="line"><i></i></div>
  </div>
  <app-root></app-root>
</body>

</html>
